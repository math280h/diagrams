name: Render diagrams
description: Renders Diagrams files to images, and shows the images before and after on a pull request.
branding:
  icon: image
  color: blue

inputs:
  files:
    description: Glob patterns of the diagram files, one for each line. Only files that git tracks count.
    default: '**/*.diagram.json'
  format:
    description: The image format, png or svg.
    default: png
  theme:
    description: >-
      The themes, separated by spaces: built-in themes such as light, dark or blueprint, or .theme.json files. With more
      than one theme, each diagram gets an image for each theme, named after the theme, for example orders.dark.png.
      Without it, the light or the dark theme, as the system of the runner is.
    default: ''
  max-size:
    description: The longest side of an image, in pixels. Without it, an image is at most 2048 pixels.
    default: ''
  mode:
    description: >-
      write renders each diagram to an image next to its file, for example docs/orders.diagram.json to docs/orders.png.
      compare renders each diagram that a pull request changes as it was and as it is, and comments on the pull
      request. On a PNG, red boxes mark the parts that changed, and an image too tall for the comment shows only the
      rows with the changes and links the whole image. auto uses compare on pull_request events and write on other
      events.
    default: auto
  publish:
    description: In compare mode, false keeps the images on the runner and does not push or comment.
    default: 'true'
  preview-branch:
    description: In compare mode, the branch that holds the images of the comments.
    default: diagram-previews
  version:
    description: >-
      The Diagrams release to download, for example v0.2.0, or latest. Without it, the release that matches the ref of
      the action: the release of a version tag such as v0.2.0, the newest release of a major tag such as v0, the release
      at a pinned commit, and for a branch or another commit the newest release that it contains.
    default: ''
  app:
    description: A command that starts Diagrams, for example a build from source. With it, the action downloads nothing.
    default: ''
  token:
    description: The token that downloads the app, pushes the images and comments.
    default: ${{ github.token }}

outputs:
  images:
    description: In write mode, the images that the action wrote, one for each line.
    value: ${{ steps.render.outputs.images }}
  previews:
    description: In compare mode, the folder with the before and after images.
    value: ${{ steps.render.outputs.previews }}

runs:
  using: composite
  steps:
    - id: render
      shell: bash
      run: node "$GITHUB_ACTION_PATH/main.mjs"
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_MAX_SIZE: ${{ inputs.max-size }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_PREVIEW_BRANCH: ${{ inputs.preview-branch }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_APP: ${{ inputs.app }}
        INPUT_TOKEN: ${{ inputs.token }}
        ACTION_REF: ${{ github.action_ref }}
