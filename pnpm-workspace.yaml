pmOnFail: ignore

minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true

allowBuilds:
  electron: true

overrides:
  '@electron/asar@<4': ^4.3.1
  '@electron/universal@<3': ^3.0.6
  electron-builder-squirrel-windows: '-'
  'filelist@<2': ^2.0.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.3
  'semver@<7': ^7.8.5
