[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-05-01
reason = "The affected code, firstPhasePreProcess(), exists from minimatch 7.0. Version 7.0 always runs it, and the versions from 7.1 run it only with optimizationLevel 2 or higher. The advisory also lists the versions before 7.0. The lockfile has minimatch 3.1.5 and 5.1.9 for the build tools of electron-builder, and minimatch 11.0.3. The override in pnpm-workspace.yaml replaces the versions 7.0.0 to 11.0.0 with ^11.0.3."

