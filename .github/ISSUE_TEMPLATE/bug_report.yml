name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Website
        - Desktop app
        - Agent tools (MCP)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or date
      description: The desktop app version, or the date you used the website.
  - type: input
    id: system
    attributes:
      label: Operating system and browser
      placeholder: Windows 11, Chrome 141
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Checkout flow template.
        2. Press Play.
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: diagram
    attributes:
      label: Diagram file
      description: If you can, attach the diagram file (Export, then Diagram file (JSON)). Remove anything private first.
