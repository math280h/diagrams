name: Display previews

on:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'electron/render-*.ts'
      - 'actions/render/**'
      - 'scripts/template-files.mjs'
      - 'scripts/app-screens.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/display-previews.yml'

permissions:
  contents: read

concurrency:
  group: display-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  previews:
    name: Compare the templates with the base commit
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Find the base branch commit of the merge
        id: base
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Build the app of this pull request
        run: |
          pnpm install --frozen-lockfile
          pnpm desktop:build
      - uses: $/.github/actions/electron
      - name: Build the app of the base commit
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm desktop:build
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Write each template as a diagram file with the code of both commits
        run: |
          node scripts/template-files.mjs .diagram-previews
          node base/scripts/template-files.mjs base/.diagram-previews
      - uses: $/.github/actions/playwright-chromium
      - name: Install Chromium for the app screens of the base commit
        working-directory: base
        run: pnpm exec playwright install chromium
      - name: Take the app screens with the build of both commits
        run: |
          node scripts/app-screens.mjs dist .app-screens 4180
          if [ -f base/scripts/app-screens.mjs ]; then
            cd base && node scripts/app-screens.mjs dist .app-screens 4181
          fi
      - name: Compare the images of both apps
        uses: $/actions/render
        with:
          files: .diagram-previews/*.diagram.json
          mode: compare
          app: node_modules/.bin/electron .
          base-app: base/node_modules/.bin/electron base
          base-root: base
          screens: .app-screens
          base-screens: base/.app-screens
