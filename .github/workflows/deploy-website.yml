name: Deploy the website

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: deploy-website

jobs:
  deploy:
    name: Deploy the live website
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Download the deploy CLI
        env:
          CLI_VERSION: 5.71.0
          CLI_SHA256: 2e682fd2ddf8d6fdf9e46d9d99d99646ff0022a6abb0c2bca93011348a269fb9
        run: |
          archive="$RUNNER_TEMP/railway.tar.gz"
          curl -fsSL --proto '=https' -o "$archive" \
            "https://github.com/railwayapp/cli/releases/download/v$CLI_VERSION/railway-v$CLI_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$CLI_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" railway
      - name: Deploy the release to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RW_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "::error::Set the variable RAILWAY_SERVICE in the release environment to the name of the website service."
            exit 1
          fi
          "$RUNNER_TEMP/railway" up --ci --service "$RAILWAY_SERVICE"
