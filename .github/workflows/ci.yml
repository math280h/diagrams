name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep the lockfile one YAML document
        run: |
          if grep -qx -- '---' pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml has more than one YAML document. GitHub's dependency graph reads only the first one."
            exit 1
          fi
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  web:
    name: Web tests ${{ matrix.shard }} of ${{ strategy.job-total }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  checks:
    name: Checks and web tests
    needs: [static, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check and every web test shard
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::Not every check passed: $RESULTS"
              exit 1
            fi
          done

  desktop:
    name: Desktop app on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm test
      - run: pnpm desktop:build
      - name: Allow the Electron sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Desktop end-to-end tests
        if: runner.os != 'Linux'
        run: pnpm e2e:desktop
      - name: Desktop end-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e:desktop
      - name: Test the render action
        if: runner.os == 'Linux'
        uses: ./actions/render
        with:
          files: actions/render/fixtures/*.diagram.json
          mode: write
          app: node_modules/.bin/electron .
      - name: Check the image of the render action
        if: runner.os == 'Linux'
        run: test -s actions/render/fixtures/orders.png
      - name: Test the render action on the pull request
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        uses: ./actions/render
        with:
          files: actions/render/fixtures/*.diagram.json
          mode: compare
          publish: 'false'
          app: node_modules/.bin/electron .
      - name: Package the app without installers
        run: pnpm exec electron-builder --dir --publish never
      - name: Test the packaged app
        if: runner.os != 'Linux'
        run: node scripts/smoke-package.mjs
      - name: Test the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smoke-package.mjs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore
