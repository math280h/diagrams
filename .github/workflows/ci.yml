name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep the lockfile one YAML document
        run: |
          if grep -qx -- '---' pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml has more than one YAML document. GitHub's dependency graph reads only the first one."
            exit 1
          fi
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - name: Show the coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node scripts/coverage.ts summary coverage/coverage-summary.json "Coverage of the unit and browser tests" \
            >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 7

  web:
    name: Web tests ${{ matrix.shard }} of ${{ strategy.job-total }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          E2E_COVERAGE: '1'
      - if: ${{ !cancelled() && hashFiles('coverage-e2e/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage-${{ matrix.shard }}
          path: coverage-e2e
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  coverage:
    name: Coverage of all tests
    needs: [static, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-coverage-*
          path: coverage-e2e
          merge-multiple: true
      - name: Merge the coverage of all tests
        run: node scripts/coverage.ts merge coverage/coverage-final.json coverage-all coverage-e2e --thresholds 77,74,58,79
      - name: Show the coverage
        if: ${{ !cancelled() && hashFiles('coverage-all/coverage-summary.json') != '' }}
        run: node scripts/coverage.ts summary coverage-all/coverage-summary.json "Coverage of all tests" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && hashFiles('coverage-all/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-all
          path: coverage-all
          retention-days: 7

  checks:
    name: Checks and web tests
    needs: [static, web, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check and every web test shard
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::Not every check passed: $RESULTS"
              exit 1
            fi
          done

  desktop:
    name: Desktop app on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright-chromium
      - run: pnpm test
      - run: pnpm desktop:build
      - name: Check the SBOM against the bundles
        if: runner.os == 'Linux'
        run: |
          pnpm sbom --sbom-format cyclonedx --sbom-type application --sbom-spec-version 1.6 --prod \
            --out "$RUNNER_TEMP/pnpm.cdx.json"
          node scripts/sbom.ts "$RUNNER_TEMP/pnpm.cdx.json" 0.0.0 "$GITHUB_SHA" "$RUNNER_TEMP/sbom.cdx.json"
      - name: Allow the Electron sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Desktop end-to-end tests
        if: runner.os != 'Linux'
        run: pnpm e2e:desktop
      - name: Desktop end-to-end tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm e2e:desktop
      - name: Test the render action
        if: runner.os == 'Linux'
        uses: ./actions/render
        with:
          files: actions/render/fixtures/*.diagram.json
          mode: write
          app: node_modules/.bin/electron .
      - name: Check the image of the render action
        if: runner.os == 'Linux'
        run: test -s actions/render/fixtures/orders.png
      - name: Test the render action on the pull request
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        uses: ./actions/render
        with:
          files: actions/render/fixtures/*.diagram.json
          mode: compare
          publish: 'false'
          app: node_modules/.bin/electron .
      - name: Build the installers of this system
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) targets=(--win nsis --x64) ;;
            macOS) targets=(--mac dmg --arm64) ;;
            Linux) targets=(--linux AppImage deb --x64) ;;
          esac
          pnpm exec electron-builder "${targets[@]}" --publish never
      - name: Install, test and remove the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*-win-x64.exe' | Where-Object Name -NotMatch '__uninstaller'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The installer ended with exit code $($install.ExitCode)." }
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Diagrams.exe' | Select-Object -First 1
          if (-not $app) { throw 'The installer did not install Diagrams.exe.' }
          node scripts/smoke-package.mjs $app.FullName
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed the smoke test.' }
          $uninstaller = Get-ChildItem $app.DirectoryName -Filter 'Uninstall*.exe' | Select-Object -First 1
          node scripts/installer-contents.ts nsis $installer.FullName $uninstaller.FullName
          if ($LASTEXITCODE -ne 0) { throw 'The SBOM does not list the plugins of the installers.' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S', "_?=$($app.DirectoryName)" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "The uninstaller ended with exit code $($uninstall.ExitCode)." }
          if (Test-Path $app.FullName) { throw 'The uninstaller did not remove Diagrams.exe.' }
      - name: Mount and test the macOS disk image
        if: runner.os == 'macOS'
        run: |
          mount=$(mktemp -d)
          hdiutil attach release/*-mac-arm64.dmg -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -force' EXIT
          node scripts/smoke-package.mjs "$mount/Diagrams.app/Contents/MacOS/Diagrams"
      - name: Test the AppImage
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls release/*.AppImage)
          chmod +x "$appimage"
          node scripts/installer-contents.ts appimage "$appimage"
          xvfb-run --auto-servernum node scripts/smoke-package.mjs "$appimage"
      - name: Install, test and remove the deb package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "$PWD/$(ls release/*.deb)"
          executable=$(dpkg -L diagrams | grep -E '^/opt/.+/diagrams$')
          xvfb-run --auto-servernum node scripts/smoke-package.mjs "$executable"
          sudo apt-get remove -y diagrams
      - name: Keep the installers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*-win-x64.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            !release/*__uninstaller*
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore
