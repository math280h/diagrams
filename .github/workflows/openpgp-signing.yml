name: Test the OpenPGP signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign:
    name: Sign the Linux packages
    runs-on: ubuntu-26.04
    environment: signing-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - uses: $/.github/actions/openpgp-signing
        with:
          workload-identity-provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ secrets.GCP_OPENPGP_SERVICE_ACCOUNT }}
          key-ring: ${{ secrets.OPENPGP_SIGNING_KEY_RING }}
          fingerprint: ${{ vars.OPENPGP_SIGNING_FINGERPRINT }}
      - run: pnpm exec electron-builder --linux AppImage deb --x64 --publish never
      - name: Sign and check the Linux packages and the checksums
        env:
          FINGERPRINT: ${{ vars.OPENPGP_SIGNING_FINGERPRINT }}
        run: |
          cp release/*.AppImage "$RUNNER_TEMP/unsigned.AppImage"
          node scripts/openpgp-signing.ts sign release --fingerprint "$FINGERPRINT"
          node scripts/openpgp-signing.ts check release --fingerprint "$FINGERPRINT" --unsigned "$RUNNER_TEMP/unsigned.AppImage"
          node scripts/openpgp-signing.ts checksums release --fingerprint "$FINGERPRINT"
