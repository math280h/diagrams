name: Capture probe

on:
  push:
    branches: [fix-capture-frame-moment]

permissions:
  contents: read

jobs:
  probe:
    name: Capture probe on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: $/.github/actions/playwright-chromium
      - run: pnpm desktop:build
      - name: Probe the captures under CPU load
        run: |
          for core in $(seq 1 "$(sysctl -n hw.ncpu)"); do (yes > /dev/null &); done
          pnpm exec playwright test --project=desktop e2e/desktop/capture-probe.spec.ts e2e/desktop/capture.spec.ts --repeat-each 8 --reporter line || status=$?
          pkill yes || true
          exit "${status:-0}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-probe-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore
