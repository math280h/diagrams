name: Preview app

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: preview-app
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare the preview release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Choose the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "version=$major.$minor.$((patch + 1))-preview.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=preview-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Preview $VERSION" \
            --notes "Installers of a build of main: $VERSION, from $GITHUB_SHA. A preview build does not update itself."

  sbom:
    name: Write the SBOM
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - name: Build the bundles, which list their packages
        run: pnpm desktop:build
      - name: Write the SBOM
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          pnpm sbom --sbom-format cyclonedx --sbom-type application --sbom-spec-version 1.6 --prod \
            --out "$RUNNER_TEMP/pnpm.cdx.json"
          node scripts/sbom.ts "$RUNNER_TEMP/pnpm.cdx.json" "$VERSION" "$TAG" "$RUNNER_TEMP/Diagrams-preview-sbom.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/Diagrams-preview-sbom.cdx.json
          if-no-files-found: error
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/Diagrams-preview-sbom.cdx.json" --repo "$GITHUB_REPOSITORY" --clobber

  package:
    name: Package for ${{ matrix.os }}
    needs: [prepare, sbom]
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - name: Package the app
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          pnpm exec electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version="$VERSION" \
            -c.artifactName='Diagrams-preview-${os}-${arch}.${ext}'
      - name: Allow the Electron sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test the packaged app
        if: runner.os != 'Linux'
        run: node scripts/smoke-package.mjs
      - name: Test the packaged app
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smoke-package.mjs
      - name: Attest the build provenance of the installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom
      - name: Attest the SBOM of the installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          sbom-path: ${{ runner.temp }}/sbom/Diagrams-preview-sbom.cdx.json
      - name: Upload the installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish the build
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Delete the older builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r -s --arg tag "$TAG" '
              [add[] | select((.tag_name | test("^preview-[0-9]+$")) and .tag_name != $tag)] |
              (map(select(.draft | not)) | max_by(.published_at) | .id) as $previous |
              .[] | select(.id != $previous) | "\(.id) \(.tag_name) \(.draft)"' |
            while read -r id tag draft; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              if [ "$draft" = false ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"; fi
            done
