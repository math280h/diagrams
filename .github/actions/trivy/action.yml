name: Install Trivy
description: Installs the pinned Trivy release for Linux x64 after a check of its SHA-256.

runs:
  using: composite
  steps:
    - name: Install Trivy
      shell: bash
      env:
        TRIVY_VERSION: 0.76.2
        TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      run: |
        archive="$RUNNER_TEMP/trivy.tar.gz"
        curl -fsSL --proto '=https' --retry 3 -o "$archive" \
          "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        echo "$TRIVY_SHA256  $archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/trivy"
        tar -xzf "$archive" -C "$RUNNER_TEMP/trivy" trivy
        echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
