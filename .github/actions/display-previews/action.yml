name: Compare two builds of Diagrams
description: >-
  Renders the diagrams with the app of a pull request and with the app of its base commit, compares two folders of app
  screenshots, and comments on the pull request with the diagrams and screens that look different. It runs the script
  of actions/render in compare mode.

inputs:
  files:
    description: Glob patterns of the diagram files, one for each line. Files that git does not track yet also count.
    required: true
  theme:
    description: The themes, separated by spaces. Each diagram gets an image for each theme.
    default: ''
  app:
    description: A command that starts the Diagrams app of the pull request.
    required: true
  base-app:
    description: A command that starts the Diagrams app of the base commit.
    required: true
  base-root:
    description: >-
      The folder that holds the diagram files of the base commit at the same paths. The base app renders those files,
      so a diagram that the pull request adds or removes shows as new or removed, and a pull request that changes the
      diagram format still gets old images. Without it, both apps render the same files.
    default: ''
  screens:
    description: >-
      A folder of PNG screenshots of the app of the pull request. The action compares each one with the file of the
      same name in base-screens. Pixels that differ by only a few levels count as the same, because the browser draws
      text edges a little differently each time.
    default: ''
  base-screens:
    description: With screens, the folder of the screenshots of the app of the base commit.
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../actions/render/main.mjs"
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_THEME: ${{ inputs.theme }}
        INPUT_MODE: compare
        INPUT_APP: ${{ inputs.app }}
        INPUT_BASE_APP: ${{ inputs.base-app }}
        INPUT_BASE_ROOT: ${{ inputs.base-root }}
        INPUT_SCREENS: ${{ inputs.screens }}
        INPUT_BASE_SCREENS: ${{ inputs.base-screens }}
        INPUT_TOKEN: ${{ github.token }}
